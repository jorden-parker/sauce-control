<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Home</title>
    <link rel="stylesheet" href="/styles.css" />
    <script type="module" src="/assets/shared.js"></script>
    <style>
      [hidden] {
        display: none;
      }
    </style>
  </head>
  <body>
    <h1>Home</h1>
    <nav>
      <a href="/about">About</a>
      <a href="/about?tab=team">Team</a>
      <a href="/users/1">First user</a>
      <a href="/users/2">Second user</a>
      <a href="/deep/one">Deep</a>
      <a href="https://example.com/">Example</a>
    </nav>
    <div role="tablist">
      <button role="tab" aria-selected="true" aria-controls="overview">
        Overview
      </button>
      <button role="tab" aria-selected="false" aria-controls="details">
        Details
      </button>
    </div>
    <section id="overview">Overview panel</section>
    <section id="details" hidden>Details panel</section>
    <button id="open-dialog">Open dialog</button>
    <div id="dialog" role="dialog" aria-label="Sign up" hidden>
      <p>Sign up form</p>
      <button id="close-dialog">Close</button>
    </div>
    <button id="more" aria-haspopup="menu">More</button>
    <ul id="menu" role="menu" hidden>
      <li role="menuitem" id="go-settings">Settings</li>
      <li role="menuitem" id="show-help">Help</li>
    </ul>
    <aside id="help" hidden>Help panel</aside>
    <script>
      var byId = function (id) {
        return document.getElementById(id);
      };
      document.querySelectorAll("[role=tab]").forEach(function (tab) {
        tab.addEventListener("click", function () {
          document.querySelectorAll("[role=tab]").forEach(function (other) {
            var selected = other === tab;
            other.setAttribute("aria-selected", String(selected));
            byId(other.getAttribute("aria-controls")).hidden = !selected;
          });
        });
      });
      byId("open-dialog").addEventListener("click", function () {
        byId("dialog").hidden = false;
      });
      byId("close-dialog").addEventListener("click", function () {
        byId("dialog").hidden = true;
      });
      byId("more").addEventListener("click", function () {
        byId("menu").hidden = !byId("menu").hidden;
      });
      byId("go-settings").addEventListener("click", function () {
        history.pushState({}, "", "/settings");
      });
      byId("show-help").addEventListener("click", function () {
        byId("menu").hidden = true;
        byId("help").hidden = false;
      });
    </script>
  </body>
</html>
